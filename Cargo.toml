# The Oak open-source workspace: the reusable `oak-core` library and the `oak`
# CLI that builds on it, developed together as sibling crates.
#
#   core/ → oakvcs-core  (the VCS foundation; published to crates.io, usable
#                         standalone — e.g. a Unity integration depends on just
#                         this with `default-features = false`)
#   cli/  → oakvcs-cli   (the `oak` binary)
#
# The closed-source server lives in a separate private repo (`oakspace`) and
# consumes `oakvcs-core` from crates.io, so nothing here depends on it.
[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "0.97.0"
edition = "2021"
authors = ["Oak Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
# The sibling core crate, depended on by the CLI. `version` keeps the CLI
# publishable (crates.io resolves `oakvcs-core` by version); `path` makes local
# workspace builds resolve to ./core directly, so no `[patch.crates-io]` is
# needed. This version must track `[workspace.package].version` above on every
# release — the publish-crates workflow bumps both in lockstep.
oak-core = { package = "oakvcs-core", version = "0.97.0", path = "core" }

# Core dependencies
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"

# HTTP
axum = { version = "0.8", features = ["multipart"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "stream", "charset", "http2", "form", "query", "multipart", "gzip"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# TOML config
toml = "1.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Archive
zip = { version = "8", default-features = false, features = ["deflate"] }

# Data parallelism (parallel working-dir hashing in the CLI scan)
rayon = "1.10"

# Git interop (gitoxide)
gix = { version = "0.81", default-features = false, features = ["sha1"] }

# Progress bars
indicatif = "0.18"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Testing
tempfile = "3.14"
